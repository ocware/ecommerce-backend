services:
  api:
    build:
      context: .
      target: development
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret
      PAYMENT_WEBHOOK_SECRET: local-payment-webhook-secret
      API_PREFIX: api
      API_VERSION: 1
      MEDIA_STORAGE_DRIVER: local
      MEDIA_LOCAL_ROOT: /app/storage/media
      MEDIA_PUBLIC_BASE_URL: /media
      MEDIA_MAX_UPLOAD_BYTES: 10485760
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - media-data:/app/storage/media
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      target: development
    command: npm run start:worker:dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret
      PAYMENT_WEBHOOK_SECRET: local-payment-webhook-secret
      API_PREFIX: api
      API_VERSION: 1
      MEDIA_STORAGE_DRIVER: local
      MEDIA_LOCAL_ROOT: /app/storage/media
      MEDIA_PUBLIC_BASE_URL: /media
      MEDIA_MAX_UPLOAD_BYTES: 10485760
    volumes:
      - .:/app
      - /app/node_modules
      - media-data:/app/storage/media
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres-data:
  media-data:
